<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Tracker</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --panel-2:#1c2330; --line:#28303d;
    --text:#e8edf4; --muted:#8b96a5;
    --accent:#3fa9f5; --accent-soft:rgba(63,169,245,.14);
    --p0:#e05555; --p25:#e08a3c; --p50:#e0c23c; --p75:#a8cc4a; --p100:#4ac26b;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    line-height:1.5; padding:20px 14px 40px;
  }
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;background:linear-gradient(135deg,var(--panel),var(--accent-soft));
    border:1px solid var(--line);border-radius:var(--radius);
  }
  header h1{font-size:1.15rem;font-weight:700}
  .lang-select{
    padding:8px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:.88rem;outline:none;cursor:pointer;
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .card h2{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px}

  /* week nav */
  .week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .week-nav .range{font-weight:700;font-variant-numeric:tabular-nums}
  .week-nav .btns{display:flex;gap:8px}
  .nav-btn{
    padding:8px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;
    background:var(--panel-2);color:var(--text);font-family:inherit;font-size:.9rem;
  }
  .nav-btn.today{border-color:var(--accent);color:var(--accent);font-weight:700}
  .summary{font-size:.85rem;color:var(--muted);margin-top:8px}
  .summary b{color:var(--text)}

  /* calendar grid */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;
  }
  .day.today{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--panel))}
  .day-head{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
  .day-head .wd{font-weight:700;color:var(--text)}
  .day.today .wd{color:var(--accent)}
  .day-empty{color:var(--line);text-align:center;font-size:.9rem;margin-top:8px}

  /* task card */
  .task{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;position:relative;border-left:4px solid var(--p0);
  }
  .task.p0{border-left-color:var(--p0)} .task.p25{border-left-color:var(--p25)}
  .task.p50{border-left-color:var(--p50)} .task.p75{border-left-color:var(--p75)}
  .task.p100{border-left-color:var(--p100);opacity:.75}
  .task .title{font-size:.88rem;font-weight:600;padding-right:20px;word-break:break-word}
  .task.p100 .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:700}
  .badge.exam{background:rgba(224,85,120,.18);color:#f08aa8}
  .badge.hw{background:rgba(63,169,245,.18);color:#7cc4f5}
  .badge.project{background:rgba(74,194,160,.18);color:#6adfc0}
  .badge.course{background:rgba(139,150,165,.16);color:var(--muted)}
  .prog-btn{
    margin-top:8px;width:100%;padding:5px 0;border:none;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:.8rem;font-weight:800;color:#0b0e12;
  }
  .prog-btn.p0{background:var(--p0)} .prog-btn.p25{background:var(--p25)}
  .prog-btn.p50{background:var(--p50)} .prog-btn.p75{background:var(--p75)}
  .prog-btn.p100{background:var(--p100)}
  .task .del{
    position:absolute;top:6px;right:7px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px;
  }
  .task .del:hover{color:#e06060}

  /* overdue strip */
  .overdue-card{border-color:var(--p0)}
  .overdue-list{display:flex;flex-direction:column;gap:8px}
  .overdue-list .task{border-left-width:4px}
  .task .due-tag{font-size:.68rem;color:var(--p0);font-weight:700}

  /* add form */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
  .field input,.field select{
    width:100%;padding:10px 12px;font-size:.95rem;font-family:inherit;
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field-wide{grid-column:1/-1}
  .btn{
    padding:11px 18px;border:none;border-radius:10px;cursor:pointer;
    background:var(--accent);color:#0b0e12;font-size:.95rem;font-weight:700;font-family:inherit;margin-top:12px;
  }
  .btn:active{filter:brightness(.85)}

  /* course chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--line);font-size:.82rem;
  }
  .chip button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0}
  .chip button:hover{color:#e06060}

  footer{padding:10px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}

  @media (max-width:820px){
    .week{grid-template-columns:1fr}
    .day{min-height:0}
    .day-empty{margin:0}
    body{padding:12px 10px 30px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 data-i18n="appTitle">Homework Tracker</h1>
    <select class="lang-select" id="langSelect" aria-label="Language">
      <option value="en">🌐 English</option>
      <option value="es">🌐 Español</option>
      <option value="zh">🌐 中文</option>
    </select>
  </header>

  <!-- week navigation -->
  <section class="card">
    <div class="week-nav">
      <div class="btns">
        <button class="nav-btn" id="prevBtn">‹</button>
        <button class="nav-btn today" id="todayBtn" data-i18n="todayBtn">This week</button>
        <button class="nav-btn" id="nextBtn">›</button>
      </div>
      <div class="range" id="weekRange"></div>
    </div>
    <div class="summary" id="summary"></div>
  </section>

  <!-- overdue -->
  <section class="card overdue-card" id="overdueCard" style="display:none">
    <h2 data-i18n="overdueTitle">Overdue</h2>
    <div class="overdue-list" id="overdueList"></div>
  </section>

  <!-- calendar -->
  <div class="week" id="week"></div>

  <!-- add task -->
  <section class="card">
    <h2 data-i18n="addTitle">New task</h2>
    <div class="grid">
      <div class="field field-wide"><label data-i18n="lblTask">Task</label>
        <input type="text" id="tTitle" maxlength="80" data-i18n-ph="phTask" placeholder="e.g. Chapter 5 exercises"></div>
      <div class="field"><label data-i18n="lblType">Type</label>
        <select id="tType">
          <option value="hw" data-i18n="typeHw">Homework</option>
          <option value="exam" data-i18n="typeExam">Exam</option>
          <option value="project" data-i18n="typeProject">Project</option>
        </select></div>
      <div class="field"><label data-i18n="lblCourse">Course</label>
        <select id="tCourse"></select></div>
      <div class="field" id="newCourseField" style="display:none">
        <label data-i18n="lblNewCourse">New course name</label>
        <input type="text" id="tNewCourse" maxlength="40"></div>
      <div class="field"><label data-i18n="lblDue">Due date</label>
        <input type="date" id="tDue"></div>
    </div>
    <button class="btn" id="tAdd" data-i18n="btnAdd">＋ Add task</button>
    <div class="chips" id="courseChips"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<script>
(function(){
  "use strict";

  var I18N = {
    en:{
      appTitle:"Homework Tracker",
      todayBtn:"This week", overdueTitle:"⚠️ Overdue",
      summary:"{n} tasks this week · {d} done",
      emptyWeek:"No tasks this week 🎉", emptyDay:"·",
      addTitle:"New task", lblTask:"Task", phTask:"e.g. Chapter 5 exercises",
      lblType:"Type", typeHw:"Homework", typeExam:"Exam", typeProject:"Project",
      lblCourse:"Course", newCourseOpt:"＋ New course…", lblNewCourse:"New course name",
      lblDue:"Due date", btnAdd:"＋ Add task",
      valErr:"Fill in the task, course and date.",
      delCourseConfirm:"Remove this course from the list? Existing tasks keep it.",
      weekdays:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
      footer:"All data is stored locally in your browser (JSON in localStorage)."
    },
    es:{
      appTitle:"Gestor de deberes",
      todayBtn:"Esta semana", overdueTitle:"⚠️ Atrasadas",
      summary:"{n} tareas esta semana · {d} hechas",
      emptyWeek:"Sin tareas esta semana 🎉", emptyDay:"·",
      addTitle:"Nueva tarea", lblTask:"Tarea", phTask:"p. ej. Ejercicios tema 5",
      lblType:"Tipo", typeHw:"Deberes", typeExam:"Examen", typeProject:"Proyecto",
      lblCourse:"Asignatura", newCourseOpt:"＋ Nueva asignatura…", lblNewCourse:"Nombre de la asignatura",
      lblDue:"Fecha límite", btnAdd:"＋ Añadir",
      valErr:"Rellena la tarea, la asignatura y la fecha.",
      delCourseConfirm:"¿Quitar esta asignatura de la lista? Las tareas existentes la conservan.",
      weekdays:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],
      footer:"Todos los datos se guardan en tu navegador (JSON en localStorage)."
    },
    zh:{
      appTitle:"作业追踪器",
      todayBtn:"本周", overdueTitle:"⚠️ 逾期未完成",
      summary:"本周 {n} 项 · 已完成 {d} 项",
      emptyWeek:"本周没有任务 🎉", emptyDay:"·",
      addTitle:"新任务", lblTask:"任务内容", phTask:"例：第五章练习",
      lblType:"类型", typeHw:"作业", typeExam:"考试", typeProject:"Project",
      lblCourse:"课程", newCourseOpt:"＋ 新增课程…", lblNewCourse:"新课程名称",
      lblDue:"截止日期", btnAdd:"＋ 添加任务",
      valErr:"请填写任务、课程和日期。",
      delCourseConfirm:"从列表移除该课程？已有任务不受影响。",
      weekdays:["周一","周二","周三","周四","周五","周六","周日"],
      footer:"所有数据以 JSON 形式保存在你的浏览器 localStorage 中。"
    }
  };

  var K_TASKS="hw_tasks_v1", K_COURSES="hw_courses_v1", K_LANG="hw_lang";
  var PROGRESS=[0,25,50,75,100];
  var TYPE_BADGE={hw:"hw", exam:"exam", project:"project"};
  var TYPE_KEY={hw:"typeHw", exam:"typeExam", project:"typeProject"};

  function getJSON(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function setJSON(k,o){ try{ localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }

  var lang = (function(){ try{ return localStorage.getItem(K_LANG)||"en"; }catch(e){ return "en"; } })();
  function t(k){ return (I18N[lang]&&I18N[lang][k])||I18N.en[k]||k; }
  function tf(k,vars){ var s=t(k); for(var x in vars){ s=s.split("{"+x+"}").join(vars[x]); } return s; }

  var $=function(id){ return document.getElementById(id); };
  var el={
    lang:$("langSelect"), prev:$("prevBtn"), next:$("nextBtn"), today:$("todayBtn"),
    range:$("weekRange"), summary:$("summary"),
    overdueCard:$("overdueCard"), overdueList:$("overdueList"), week:$("week"),
    tTitle:$("tTitle"), tType:$("tType"), tCourse:$("tCourse"),
    newCourseField:$("newCourseField"), tNewCourse:$("tNewCourse"),
    tDue:$("tDue"), tAdd:$("tAdd"), chips:$("courseChips")
  };

  function tasks(){ return getJSON(K_TASKS,[]); }
  function saveTasks(a){ setJSON(K_TASKS,a); }
  function courses(){ return getJSON(K_COURSES,[]); }
  function saveCourses(a){ setJSON(K_COURSES,a); }
  function uid(){ return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }

  /* ── dates (Monday-start weeks, local time) ── */
  function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function todayStr(){ return fmt(new Date()); }
  function mondayOf(d){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    return x;
  }
  var weekOffset=0;

  /* ── i18n ── */
  function applyI18n(){
    document.documentElement.lang = lang==="zh"?"zh-CN":lang;
    var ns=document.querySelectorAll("[data-i18n]");
    for(var i=0;i<ns.length;i++) ns[i].textContent=t(ns[i].getAttribute("data-i18n"));
    var ps=document.querySelectorAll("[data-i18n-ph]");
    for(var j=0;j<ps.length;j++) ps[j].placeholder=t(ps[j].getAttribute("data-i18n-ph"));
    el.lang.value=lang;
  }

  /* ── course select + chips ── */
  function renderCourses(){
    var cs=courses();
    var prev=el.tCourse.value;
    el.tCourse.innerHTML = cs.map(function(c){
      return '<option value="'+c.replace(/"/g,"&quot;")+'">'+c+'</option>';
    }).join("") + '<option value="__new">'+t("newCourseOpt")+'</option>';
    if(prev && prev!=="__new" && cs.indexOf(prev)>=0) el.tCourse.value=prev;
    el.newCourseField.style.display = el.tCourse.value==="__new" ? "" : "none";

    el.chips.innerHTML = cs.map(function(c,i){
      return '<span class="chip">'+c+'<button data-ci="'+i+'">✕</button></span>';
    }).join("");
  }

  /* ── task card html ── */
  function pClass(p){ return "p"+p; }
  function taskCard(task, showDue){
    var typeCls = TYPE_BADGE[task.type]||"hw";
    return '<div class="task '+pClass(task.progress)+'" data-id="'+task.id+'">'
      + '<button class="del" data-del="'+task.id+'">✕</button>'
      + '<div class="title">'+task.title+'</div>'
      + '<div class="meta">'
      +   '<span class="badge '+typeCls+'">'+t(TYPE_KEY[task.type]||"typeHw")+'</span>'
      +   (task.course? '<span class="badge course">'+task.course+'</span>' : '')
      +   (showDue? '<span class="due-tag">'+task.due+'</span>' : '')
      + '</div>'
      + '<button class="prog-btn '+pClass(task.progress)+'" data-prog="'+task.id+'">'+task.progress+'%</button>'
      + '</div>';
  }

  /* ── render ── */
  function render(){
    var all=tasks();
    var mon=mondayOf(new Date());
    mon.setDate(mon.getDate()+weekOffset*7);
    var days=[];
    for(var i=0;i<7;i++){
      var d=new Date(mon); d.setDate(d.getDate()+i);
      days.push(fmt(d));
    }
    el.range.textContent = days[0]+" ~ "+days[6];

    var tToday=todayStr();
    var weekTasks=0, doneTasks=0;
    el.week.innerHTML = days.map(function(ds,i){
      var list=all.filter(function(x){ return x.due===ds; })
                  .sort(function(a,b){ return a.progress-b.progress; });
      weekTasks+=list.length;
      doneTasks+=list.filter(function(x){ return x.progress===100; }).length;
      var body=list.length
        ? list.map(function(x){ return taskCard(x,false); }).join("")
        : '<div class="day-empty">'+t("emptyDay")+'</div>';
      return '<div class="day'+(ds===tToday?" today":"")+'">'
        + '<div class="day-head"><span class="wd">'+t("weekdays")[i]+'</span><span>'+ds.slice(5)+'</span></div>'
        + body + '</div>';
    }).join("");

    el.summary.textContent = weekTasks
      ? tf("summary",{n:weekTasks,d:doneTasks})
      : t("emptyWeek");

    // overdue: before today, not finished
    var od=all.filter(function(x){ return x.due<tToday && x.progress<100; })
              .sort(function(a,b){ return a.due<b.due?-1:1; });
    el.overdueCard.style.display = od.length? "" : "none";
    el.overdueList.innerHTML = od.map(function(x){ return taskCard(x,true); }).join("");

    renderCourses();
  }

  /* ── events ── */
  el.lang.addEventListener("change",function(){
    lang=el.lang.value;
    try{ localStorage.setItem(K_LANG,lang); }catch(e){}
    applyI18n(); render();
  });
  el.prev.addEventListener("click",function(){ weekOffset--; render(); });
  el.next.addEventListener("click",function(){ weekOffset++; render(); });
  el.today.addEventListener("click",function(){ weekOffset=0; render(); });

  el.tCourse.addEventListener("change",function(){
    el.newCourseField.style.display = el.tCourse.value==="__new" ? "" : "none";
  });

  el.tAdd.addEventListener("click",function(){
    var title=(el.tTitle.value||"").trim();
    var due=el.tDue.value;
    var course=el.tCourse.value;
    if(course==="__new"){
      course=(el.tNewCourse.value||"").trim();
      if(course && courses().indexOf(course)<0){
        var cs=courses(); cs.push(course); saveCourses(cs);
      }
    }
    if(!title || !due || !course){ alert(t("valErr")); return; }
    var a=tasks();
    a.push({ id:uid(), title:title, type:el.tType.value, course:course, due:due, progress:0 });
    saveTasks(a);
    el.tTitle.value=""; el.tNewCourse.value="";
    el.tCourse.value=course;
    render();
  });

  // delegated: progress cycle + delete (both grid and overdue list)
  document.addEventListener("click",function(e){
    var pb=e.target.closest("[data-prog]");
    if(pb){
      var a=tasks();
      var x=a.find(function(y){ return y.id===pb.getAttribute("data-prog"); });
      if(x){
        var idx=PROGRESS.indexOf(x.progress);
        x.progress=PROGRESS[(idx+1)%PROGRESS.length];
        saveTasks(a); render();
      }
      return;
    }
    var db=e.target.closest("[data-del]");
    if(db){
      saveTasks(tasks().filter(function(y){ return y.id!==db.getAttribute("data-del"); }));
      render();
      return;
    }
    var cb=e.target.closest("[data-ci]");
    if(cb){
      if(!confirm(t("delCourseConfirm"))) return;
      var cs=courses(); cs.splice(parseInt(cb.getAttribute("data-ci"),10),1);
      saveCourses(cs); render();
    }
  });

  /* ── init ── */
  el.tDue.value=todayStr();
  applyI18n();
  render();
})();
</script>
</body>
</html>
